<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen-AI Remote</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="container">
                <h1>Screen-AI</h1>
                <p class="subtitle">Local AI PC Operator</p>

                <div class="login-methods">
                    <button class="method-tab active" data-method="qr">Scan QR</button>
                    <button class="method-tab" data-method="code">Enter Code</button>
                    <button class="method-tab" data-method="trusted">Trusted</button>
                </div>

                <div id="qr-method" class="method-content active">
                    <div class="qr-scanner">
                        <div class="qr-frame">
                            <div class="qr-corner tl"></div>
                            <div class="qr-corner tr"></div>
                            <div class="qr-corner bl"></div>
                            <div class="qr-corner br"></div>
                            <p class="qr-hint">Point camera at QR payload on PC</p>
                        </div>
                        <button id="start-camera" class="primary-btn">Start Camera</button>
                        <button id="stop-camera" class="secondary-btn hidden">Stop Camera</button>
                    </div>
                    <div id="qr-status" class="status"></div>
                </div>

                <div id="code-method" class="method-content">
                    <div class="code-form">
                        <p>Enter the 6-digit code shown on your PC:</p>
                        <input
                            type="text"
                            id="pairing-code"
                            placeholder="000000"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            inputmode="numeric"
                        >
                        <input
                            type="text"
                            id="device-name"
                            placeholder="Device name (e.g., My Phone)"
                        >
                        <label class="checkbox-label">
                            <input type="checkbox" id="trust-device">
                            <span>Trust this device for 30 days</span>
                        </label>
                        <button id="pair-button" class="primary-btn">Pair Device</button>
                        <p id="pair-error" class="error"></p>
                    </div>
                </div>

                <div id="trusted-method" class="method-content">
                    <div class="trusted-form">
                        <p>If this phone was paired and trusted before, reconnect without typing a code.</p>
                        <button id="check-trusted" class="primary-btn">Check Trusted Status</button>
                        <div id="trusted-status" class="status"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Screen -->
        <div id="main-screen" class="screen">
            <div class="header">
                <div class="brand-block">
                    <h1>Screen-AI</h1>
                    <div id="connection-badge" class="connection-badge" data-state="offline" aria-live="polite">
                        <span class="connection-dot"></span>
                        <span id="connection-label">Offline</span>
                    </div>
                </div>
                <button id="emergency-stop" class="emergency-btn">🛑 STOP</button>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="command">Command</button>
                <button class="tab" data-tab="approvals">Approvals</button>
                <button class="tab" data-tab="history">History</button>
                <button class="tab" data-tab="settings">Settings</button>
            </div>

            <!-- Command Tab -->
            <div id="command-tab" class="tab-content active">
                <div class="command-input">
                    <textarea
                        id="command-text"
                        placeholder="Type a command...&#10;e.g., 'Check my storage'&#10;'Open Chrome'&#10;'Delete files in Downloads'"
                    ></textarea>
                    <button id="send-command">Send</button>
                </div>
                <div id="command-progress" class="progress-list hidden" aria-live="polite"></div>
                <div id="command-response" class="response"></div>
            </div>

            <!-- Approvals Tab -->
            <div id="approvals-tab" class="tab-content">
                <h2>Pending Approvals</h2>
                <div id="approvals-list"></div>
            </div>

            <!-- History Tab -->
            <div id="history-tab" class="tab-content">
                <h2>Command History</h2>
                <div id="history-list"></div>
            </div>

            <!-- Settings Tab -->
            <div id="settings-tab" class="tab-content">
                <h2>Settings</h2>
                <div class="setting">
                    <label>Device Name:</label>
                    <span id="device-name-display"></span>
                </div>
                <div class="setting">
                    <label>Device ID:</label>
                    <span id="device-id-display"></span>
                </div>
                <div class="setting">
                    <label>Trust Status:</label>
                    <span id="trust-status-display">Not trusted</span>
                </div>
                <div class="setting">
                    <label>Token Expires:</label>
                    <span id="token-expiry-display">-</span>
                </div>
                <button id="rotate-token-btn" class="secondary-btn">Rotate Token Now</button>
                <button id="unpair-button" class="danger-btn">Unpair Device</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="app.js"></script>
</body>
</html>
